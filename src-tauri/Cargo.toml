[package]
name = "soundboard"
version = "0.1.0"
description = "A modern, professional cross-platform soundboard."
authors = ["Soundboard contributors"]
edition = "2021"
rust-version = "1.77"

# The Cargo bin is named `soundboard-desktop` to avoid colliding with the
# package name when referenced by tooling.
[[bin]]
name = "soundboard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# By default Tauri runs in production mode; custom-protocol is used when bundling.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
